<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    text { font-family: Arial, sans-serif; fill: #111; }
    .title { font-size: 28px; font-weight: 700; }
    .box { fill: #fff; stroke: #222; stroke-width: 2; rx: 14; }
    .label { font-size: 19px; font-weight: 700; }
    .small { font-size: 15px; }
    .arrow { stroke: #222; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
  </defs>
  <text x="600" y="42" text-anchor="middle" class="title">Multimodal Multi-Agent Food Recommender</text>
  <rect x="450" y="70" width="300" height="70" class="box"/>
  <text x="600" y="100" text-anchor="middle" class="label">User Query</text>
  <text x="600" y="124" text-anchor="middle" class="small">Gradio chat interface</text>
  <rect x="405" y="180" width="390" height="90" class="box"/>
  <text x="600" y="212" text-anchor="middle" class="label">Structured Interpretation</text>
  <text x="600" y="238" text-anchor="middle" class="small">intent + cuisine + budget + dietary + location</text>
  <rect x="80" y="330" width="460" height="155" class="box"/>
  <text x="310" y="363" text-anchor="middle" class="label">Local Retrieval Layer</text>
  <text x="310" y="392" text-anchor="middle" class="small">SentenceTransformer semantic retrieval</text>
  <text x="310" y="418" text-anchor="middle" class="small">CLIP joint-space visual retrieval</text>
  <text x="310" y="444" text-anchor="middle" class="small">Chroma metadata filtering</text>
  <text x="310" y="470" text-anchor="middle" class="small">score normalization + multimodal fusion</text>
  <rect x="660" y="330" width="460" height="155" class="box"/>
  <text x="890" y="363" text-anchor="middle" class="label">Specialized Analysis Agents</text>
  <text x="890" y="398" text-anchor="middle" class="small">profile</text>
  <text x="890" y="424" text-anchor="middle" class="small">trend • style • nutrition</text>
  <text x="890" y="456" text-anchor="middle" class="small">LangGraph orchestration</text>
  <rect x="405" y="555" width="390" height="90" class="box"/>
  <text x="600" y="587" text-anchor="middle" class="label">Grounded Recommender</text>
  <text x="600" y="615" text-anchor="middle" class="small">may reference retrieved candidate IDs only</text>
  <rect x="450" y="685" width="300" height="55" class="box"/>
  <text x="600" y="719" text-anchor="middle" class="label">Restaurant / Recipe Result</text>
  <path d="M600 140 L600 180" class="arrow"/>
  <path d="M500 270 L310 330" class="arrow"/>
  <path d="M700 270 L890 330" class="arrow"/>
  <path d="M540 407 L660 407" class="arrow"/>
  <path d="M310 485 L490 555" class="arrow"/>
  <path d="M890 485 L710 555" class="arrow"/>
  <path d="M600 645 L600 685" class="arrow"/>
</svg>
